[project]
name = "flipcheck"
version = "0.1.0"
description = "Which fields in your agent's decision request an attacker can move, and whether that's noise or a real flip"
readme = "README.md"
authors = [
    { name = "Devansh Choudhary", email = "devanshchoudhary999@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
license = "MIT"

[project.urls]
Homepage = "https://github.com/devanshchoudhary20/flipcheck"
Repository = "https://github.com/devanshchoudhary20/flipcheck"
Issues = "https://github.com/devanshchoudhary20/flipcheck/issues"

[project.scripts]
flipcheck = "flipcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages already includes every file under src/flipcheck, fixtures and payloads.json
# included; force-include of the same paths duplicated them and broke the build
packages = ["src/flipcheck"]

[tool.hatch.build.targets.sdist]
exclude = [".anbu", "CLAUDE.md", "tests", "uv.lock", ".python-version"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# .anbu holds mission artifacts and tester scratch scripts, not shipped or reviewed source
exclude = [".anbu"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
